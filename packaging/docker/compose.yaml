services:
  music-deduper:
    image: ${FINDREPEATEDSONG_IMAGE:-findrepeatedsong:0.2.0}
    container_name: findrepeatedsong
    restart: unless-stopped
    ports:
      - "${FINDREPEATEDSONG_PORT:-38491}:38491"
    volumes:
      - "${FINDREPEATEDSONG_DATA_DIR:-./data}:/app/data"
      - "${FINDREPEATEDSONG_MUSIC_DIR:-./music}:/music:rw"
