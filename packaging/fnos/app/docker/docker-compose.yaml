services:
  music-deduper:
    image: ghcr.io/guchengod/findrepeatedsong:${FINDREPEATEDSONG_VERSION:-0.2.1}
    container_name: findrepeatedsong
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:38491"
    volumes:
      - "${TRIM_PKGVAR}/data:/app/data"
      - "${wizard_music_path}:/music:rw"
    environment:
      FINDREPEATEDSONG_BROWSE_ROOT: /music
